name: LIFE quality gates
on:
  pull_request:
    paths: ['life-app/**', '.github/workflows/life-quality.yml']
  push:
    branches: [main]
    paths: ['life-app/**', '.github/workflows/life-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: life-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Generate route types and typecheck
        run: pnpm run typecheck
      - name: Release regression tests
        run: pnpm run test:regression
